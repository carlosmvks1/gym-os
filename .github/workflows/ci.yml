name: Gym OS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Python tests
        run: python -m unittest discover -s tests -v

      - name: JavaScript coach tests
        run: node --test tests-js/*.test.mjs

      - name: Syntax and JSON checks
        run: |
          node --check docs/app.js
          node --check docs/coach.js
          node --check docs/sw.js
          python -m json.tool docs/manifest.webmanifest > /dev/null
          python -m json.tool docs/exercises.json > /dev/null

  pwa-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Playwright
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium

      - name: Browser and offline PWA tests
        run: npm run test:e2e

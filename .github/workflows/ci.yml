name: Gym OS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python tests
        run: python -m unittest discover -s tests -v

      - name: JavaScript coach tests
        run: node --test tests-js/*.test.mjs

      - name: Syntax and JSON checks
        run: |
          node --check docs/app.js
          node --check docs/coach.js
          node --check docs/sw.js
          python -m json.tool docs/manifest.webmanifest > /dev/null
          python -m json.tool docs/exercises.json > /dev/null
